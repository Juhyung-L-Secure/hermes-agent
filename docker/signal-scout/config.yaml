model:
  provider: openai-codex
  default: gpt-5.6-luna
agent:
  max_turns: 3
  reasoning_effort: low
  run_budget_seconds: 0
  api_max_retries: 2
  intent_ack_continuation: false
  empty_response_guard:
    enabled: false
plugins:
  enabled: [signal-scout]
compression:
  enabled: true
  threshold_tokens: 250000
memory:
  memory_enabled: false
  user_profile_enabled: false
checkpoints:
  enabled: false
curator:
  enabled: false
tools:
  tool_search:
    enabled: false
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3
scout_diagnostics:
  max_record_bytes: 65536
  max_pending_bytes: 1048576
browser:
  mode: headless
  viewer: false
  cloud_provider: local
  engine: chrome
  use_real_profile: false
  auto_local_for_private_urls: false
  command_timeout: 60
  observation_timeout: 5
  interaction_observation_timeout: 0.25
  navigation_retries: 1
  scroll_pixels: 500
  action_permissions:
    click: allowed
    navigate: allowed
    type: allowed
    keypress: allowed
    back: allowed
    scroll: allowed
    snapshot: allowed
    screenshot: allowed
    get_images: allowed
    list_tabs: allowed
    switch_tab: allowed
    close: allowed
  viewport:
    width: 1280
    height: 720
    device_scale_factor: 1
scout_proxy:
  dns_timeout: 5
  connect_timeout: 10
  idle_timeout: 60
scout_lifecycle:
  startup_timeout: 20
  control_connect_timeout: 2
  shutdown_timeout: 5
  smoke_timeout: 120
scout_network:
  subnet: 172.30.242.0/29
  proxy_address: 172.30.242.2
  scout_address: 172.30.242.3
  browser_address: 172.30.242.4
  proxy_port: 3128
  control_port: 9222
  relay_port: 9223
  viewer_port: 6080
  viewer_subnet: 172.30.243.0/30
  viewer_address: 172.30.243.2

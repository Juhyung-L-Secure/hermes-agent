services:
  firewall:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"]
    restart: "no"
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "1"
        compress: "false"
    image: signal-scout-bootstrap-network:local
    user: "0:0"
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    command: [/usr/local/bin/scout-firewall]
    volumes: [scout-logs:/var/log/scout]
    networks:
      restricted:
        ipv4_address: 172.30.242.4
      viewer:
        ipv4_address: 172.30.243.2
    # Only viewer transport is published. Disabled config starts no listener.
    ports: ["127.0.0.1:6080:6080"]
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: [CMD, test, -f, /tmp/firewall-ready]
      interval: 2s
      timeout: 1s
      retries: 10
